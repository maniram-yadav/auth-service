# Local stack: MongoDB + auth-service.  Usage: cp .env.example .env && docker compose up --build
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  auth-service:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/auth_service
      NODE_ENV: ${NODE_ENV:-development}
      TENANTS_FILE: /app/config/tenants.json
    volumes:
      - ./tenants.json:/app/config/tenants.json:ro
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
